
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatNova RX</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#e9f2ee;color:#172b24}
header{background:#075e45;color:white;padding:18px;font-size:23px;font-weight:bold}
main{max-width:850px;margin:25px auto;padding:15px}
.panel{background:white;border-radius:14px;padding:20px;box-shadow:0 4px 18px #0001}
h2{margin-top:0}
input,button{padding:13px;border-radius:8px;border:1px solid #ddd;font-size:15px}
input{width:100%;margin:7px 0}
button{background:#087b59;color:white;border:0;cursor:pointer}
button:hover{background:#065f46}
#chat{display:none}
#messages{height:350px;overflow:auto;border:1px solid #eee;padding:12px;margin:12px 0;border-radius:10px}
.msg{background:#d9f8e8;padding:10px;border-radius:10px;margin:8px 0;max-width:85%;overflow-wrap:anywhere}
small{color:#667}
.send{display:flex;gap:8px}
.send input{flex:1}
</style>
</head>
<body>
<header>💬 ChatNova RX</header>
<main>
<section class="panel" id="login">
<h2>Welcome to ChatNova RX</h2>
<p>Sign in to open your chat.</p>
<input id="username" placeholder="Enter your name">
<button onclick="login()">Continue</button>
</section>

<section class="panel" id="chat">
<h2 id="welcome">Your Chat</h2>
<small>Personal demo chat · Messages stay in this browser</small>
<div id="messages"></div>
<div class="send">
<input id="message" placeholder="Type a message..." onkeydown="if(event.key==='Enter')send()">
<button onclick="send()">Send</button>
</div>
<button onclick="logout()" style="margin-top:12px;background:#777">Log out</button>
</section>
</main>

<script>
let user="";
function login(){
 const name=document.getElementById("username").value.trim();
 if(!name){alert("Please enter your name");return}
 user=name;
 document.getElementById("login").style.display="none";
 document.getElementById("chat").style.display="block";
 document.getElementById("welcome").textContent="Welcome, "+user+"!";
 showMessages();
}
function send(){
 const box=document.getElementById("message");
 const value=box.value.trim();
 if(!value)return;
 const messages=JSON.parse(localStorage.getItem("chatnova_messages")||"[]");
 messages.push({user:user,text:value,time:new Date().toLocaleTimeString()});
 localStorage.setItem("chatnova_messages",JSON.stringify(messages));
 box.value="";
 showMessages();
}
function showMessages(){
 const messages=JSON.parse(localStorage.getItem("chatnova_messages")||"[]");
 document.getElementById("messages").innerHTML="";
 messages.forEach(m=>{
  const div=document.createElement("div");
  div.className="msg";
  const strong=document.createElement("strong");
  strong.textContent=m.user+": ";
  div.appendChild(strong);
  div.appendChild(document.createTextNode(m.text+" "));
  const time=document.createElement("small");
  time.textContent=m.time;
  div.appendChild(time);
  document.getElementById("messages").appendChild(div);
 });
 document.getElementById("messages").scrollTop=999999;
}
function logout(){
 user="";
 document.getElementById("chat").style.display="none";
 document.getElementById("login").style.display="block";
}
</script>
</body>
</html>
