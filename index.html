
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatNova RX</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071b17;color:white;font-family:Arial,sans-serif}
.app{max-width:650px;height:100vh;margin:auto;display:flex;flex-direction:column;background:#102923}
header{padding:18px;background:#075e48;font-size:23px;font-weight:bold}
#login{padding:25px;text-align:center;margin:auto;width:100%}
input{padding:14px;border:0;border-radius:9px;font-size:16px;width:100%;outline:none}
button{padding:14px 20px;border:0;border-radius:9px;background:#00c78b;color:#06251d;font-weight:bold;cursor:pointer}
#login button{margin-top:12px;width:100%}
#chat{display:none;flex:1;min-height:0;flex-direction:column}
#messages{flex:1;overflow-y:auto;padding:15px}
.msg{background:#17483a;padding:12px;margin:9px 0;border-radius:12px;overflow-wrap:anywhere}
.msg b{color:#5fffc4}
.msg small{display:block;color:#b8d6cb;margin-top:5px}
#status{padding:8px 15px;color:#8fe6c7;font-size:13px}
#sendbox{display:flex;gap:8px;padding:12px;background:#0b211c}
#sendbox input{flex:1;min-width:0}
</style>
</head>
<body>
<div class="app">
<header>🟢 ChatNova RX</header>

<div id="login">
<h2>Welcome to ChatNova RX</h2>
<p>Enter your name to join the chat</p>
<input id="username" maxlength="30" placeholder="Your name">
<button onclick="joinChat()">Join Chat</button>
</div>

<div id="chat">
<div id="status">Connecting...</div>
<div id="messages"></div>
<div id="sendbox">
<input id="messageInput" maxlength="2000" placeholder="Type a message...">
<button onclick="sendMessage()">Send</button>
</div>
</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
let socket;
let username = "";

function joinChat(){
  username = document.getElementById("username").value.trim();
  if(!username){
    alert("Please enter your name");
    return;
  }

  document.getElementById("login").style.display = "none";
  document.getElementById("chat").style.display = "flex";

  socket = io();

  socket.on("connect", () => {
    document.getElementById("status").textContent = "🟢 Connected";
  });

  socket.on("disconnect", () => {
    document.getElementById("status").textContent = "🔴 Disconnected. Reconnecting...";
  });

  socket.on("chat history", (history) => {
    document.getElementById("messages").innerHTML = "";
    history.forEach(showMessage);
  });

  socket.on("chat message", showMessage);
}

function sendMessage(){
  const input = document.getElementById("messageInput");
  const message = input.value.trim();

  if(!message || !socket || !socket.connected) return;

  socket.emit("chat message", {
    name: username,
    message: message
  });

  input.value = "";
}

function showMessage(data){
  const area = document.getElementById("messages");
  const box = document.createElement("div");
  box.className = "msg";

  const name = document.createElement("b");
  name.textContent = data.name;

  const text = document.createElement("div");
  text.textContent = data.message;

  const time = document.createElement("small");
  time.textContent = new Date(data.time).toLocaleTimeString();

  box.append(name, text, time);
  area.appendChild(box);
  area.scrollTop = area.scrollHeight;
}

document.getElementById("messageInput").addEventListener("keydown", function(e){
  if(e.key === "Enter") sendMessage();
});
document.getElementById("username").addEventListener("keydown", function(e){
  if(e.key === "Enter") joinChat();
});
</script>
</body>
</html>
